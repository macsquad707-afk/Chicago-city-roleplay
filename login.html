<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#41b6e6">
<title>Sign in | Chicago Moderation</title>
<link rel="icon" type="image/webp" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  /* Same flag tokens as the public site (Home.html), so signing in starts from the site staff already know. */
  :root {
    color-scheme: light;
    --white: #fff; --sky: #41b6e6; --red: #e4002b; --ink: #14212b; --steel: #5b6770; --line: #dde4ea;
    --discord: #5865f2; --discord-hover: #4752c4;
    font-family: "Archivo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh; background: var(--white); color: var(--ink);
    display: grid; place-items: center;
    border-top: 16px solid var(--sky);
    padding: 24px 16px 12vh;   /* extra bottom space sits the column slightly above center */
  }
  main { width: 100%; max-width: 400px; }
  .logo { display: block; width: 64px; height: 64px; object-fit: contain; margin: 0 0 24px; }

  h1 {
    font-stretch: 68%; font-weight: 850; text-transform: uppercase;
    font-size: clamp(48px, 12vw, 64px); line-height: .88; margin: 0 0 16px; text-wrap: balance;
  }
  .lede { color: var(--steel); font-size: 17px; line-height: 1.55; margin: 0 0 32px; max-width: 34ch; }

  .error {
    color: #7a0017; background: #fdeef1; font-size: 15px; line-height: 1.5; font-weight: 500;
    border-left: 4px solid var(--red); padding: 10px 14px; margin: 0 0 24px;
  }

  .discord {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; min-height: 52px; padding: 0 20px; border-radius: 4px;
    background: var(--discord); color: #fff; text-decoration: none;
    font-size: 17px; font-weight: 700;
    transition: background-color .15s ease;
  }
  .discord:hover { background: var(--discord-hover); }
  .discord:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  .discord svg { width: 22px; height: 22px; flex: none; }

  .note {
    color: var(--steel); font-size: 14px; line-height: 1.55;
    border-top: 1px solid var(--line); padding-top: 16px; margin: 28px 0 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .discord { transition: none; }
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo.webp" alt="" width="64" height="64">
  <h1>Chicago Moderation</h1>
  <p class="lede">For server staff. Sign in with the Discord account you use in the server.</p>
  <!--error-->
  <a class="discord" href="/auth/login">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.32 4.37A19.8 19.8 0 0015.39 2.8a13.8 13.8 0 00-.63 1.3 18.4 18.4 0 00-5.52 0 12.6 12.6 0 00-.64-1.3 19.7 19.7 0 00-4.93 1.53C.53 9.05-.32 13.6.1 18.1a19.9 19.9 0 006.04 3.05 14.6 14.6 0 001.29-2.1 12.9 12.9 0 01-2.03-.98l.5-.38a14.2 14.2 0 0012.2 0l.5.38c-.65.38-1.33.71-2.04.98.37.74.8 1.44 1.3 2.1a19.8 19.8 0 006.03-3.05c.5-5.2-.84-9.7-3.57-13.73zM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.21 0 2.18 1.1 2.16 2.42 0 1.34-.96 2.42-2.16 2.42zm7.97 0c-1.19 0-2.16-1.08-2.16-2.42 0-1.33.95-2.42 2.16-2.42 1.2 0 2.18 1.1 2.16 2.42 0 1.34-.95 2.42-2.16 2.42z"/></svg>
    Sign in with Discord
  </a>
  <p class="note">The panel reads only your Discord name and avatar, then checks your staff role in the server. It can't post or message as you.</p>
</main>
</body>
</html>
