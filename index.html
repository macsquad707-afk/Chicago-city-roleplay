<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<title>Chicago Moderation</title>
<link rel="icon" type="image/webp" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;   /* dark native scrollbars, date pickers, autofill */
    /* Chrome stays colorless; hue is reserved for meaning (ban red, warning amber, team colors). */
    --bg: #121212;
    --side: #0f0f0f;
    --surface: #171717;
    --raised: #1e1e1e;
    --border: #262626;
    --border-hi: #3d3d3d;
    --ink: #ececec;
    --text: #d4d4d4;
    --muted: #a3a3a3;
    --label: #858585;
    --accent: #e0e0e0;
    --accent-hover: #ececec;
    --accent-ink: #121212;
    --active-bg: #232323;
    --hover: #1c1c1c;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { scrollbar-color: var(--border-hi) transparent; }
  body { background: var(--bg); color: var(--text); display: flex; touch-action: manipulation; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 250px; flex: none; height: 100vh; overflow-y: auto;
    background: var(--side); border-right: 1px solid var(--border);
    padding: 22px 8px; transition: width .15s ease;
  }
  .side-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 0 14px; margin: -6px 0 22px; }
  .side-name { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 14.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .side-name img { width: 28px; height: 28px; flex: none; object-fit: contain; }
  .side-name .lbl { overflow: hidden; text-overflow: ellipsis; }
  .side-toggle {
    width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px;
    background: none; color: var(--label); cursor: pointer; transition: background .15s, color .15s, transform .1s;
  }
  .side-toggle svg { width: 18px; height: 18px; }
  .side-toggle:hover { background: var(--hover); color: var(--text); }
  .side-toggle:active { transform: scale(.94); }
  .side-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* chevron points the way the sidebar will move */
  .side-chev { transition: transform .2s ease; transform-box: fill-box; transform-origin: center; }
  body.side-closed .side-chev { transform: rotate(180deg); }
  @media (min-width: 761px) {
    body.side-closed .sidebar { width: 64px; overflow-x: hidden; }
    body.side-closed .group-label { display: none; }
    body.side-closed .side-top { justify-content: center; padding: 0; }
    body.side-closed .side-name { display: none; }
    /* hidden visually but kept for screen readers */
    body.side-closed .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  }
  .group + .group, .logout { margin-top: 26px; }
  .group-label {
    font-size: 12.5px; font-weight: 500;
    color: var(--label); padding: 0 14px; margin: 0 0 10px;
  }
  .item {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    width: 100%; border: 0; background: none; cursor: pointer; text-align: left; text-decoration: none;
    color: var(--muted); font: inherit; font-size: 14.5px; font-weight: 500;
    padding: 9px 14px; border-radius: 8px; margin-bottom: 4px;
  }
  .item svg { width: 18px; height: 18px; flex: none; }
  .item:hover { background: var(--hover); color: var(--text); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .item.active { background: var(--active-bg); color: var(--ink); font-weight: 600; }
  .item.active::before {
    content: ""; position: absolute; left: -8px; top: 4px; bottom: 4px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
  }

  /* ---------- Content ---------- */
  .content { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; padding: 32px 40px; }
  .content h1 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
  .content p.sub { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
  .placeholder {
    border: 1px dashed var(--border); border-radius: 14px; padding: 48px 24px;
    text-align: center; color: var(--muted); font-size: 14px;
  }


  /* ---------- Overview ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; margin-bottom: 16px;
    background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  }
  .stat { background: var(--surface); padding: 16px 18px 14px; }
  /* only a stat that needs action gets its color */
  .stat.hot { box-shadow: inset 0 2px 0 color-mix(in srgb, var(--tint) 55%, transparent); }
  .stat-top { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 500; color: var(--muted); }
  .stat-icon { display: grid; place-items: center; color: var(--label); }
  .stat.hot .stat-icon, .stat.hot .stat-value { color: var(--tint); }
  .stat-icon svg { width: 16px; height: 16px; }
  .stat-value { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 14px 0 6px; color: var(--ink); }
  .stat-note { font-size: 12px; color: var(--label); min-height: 14px; }

  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
  .panel { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 18px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600;
  }
  .panel-head .t { display: flex; align-items: center; gap: 10px; }
  .panel-head .t svg { width: 17px; height: 17px; color: var(--muted); }
  .panel-head a { color: var(--muted); font-size: 12.5px; font-weight: 400; text-decoration: none; }
  .panel-head a:hover { color: var(--text); }
  .panel-body { flex: 1; }
  .tall { height: 470px; }
  .short { min-height: 230px; }

  .feed { padding: 8px; overflow: hidden; height: 100%; }
  .row { display: flex; align-items: center; gap: 12px; padding: 0 8px; height: 40px; border-radius: 8px; font-size: 13.5px; color: var(--muted); }
  .row:hover { background: var(--hover); }
  .row b { color: var(--ink); font-weight: 600; }
  .row-icon { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: #1d1d1d; color: var(--muted); }
  .row-icon svg { width: 14px; height: 14px; }
  .row-icon.command { background: #222; color: #bdbdbd; }
  .row-icon.join { background: #0f2a1d; color: #3ddc97; }
  .row-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.call { height: 52px; }
  .row.call .row-text b, .row.call .row-text small { display: block; overflow: hidden; text-overflow: ellipsis; }
  .row.call .row-text small { margin-top: 2px; font-size: 12px; color: var(--label); }
  .call-wait { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: rgba(245,166,35,.12); color: #f5a623; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .call-wait svg { width: 12px; height: 12px; }
  .row-time { font-size: 12px; color: var(--label); flex: none; }

  .empty { height: 100%; min-height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 13.5px; padding: 24px; }
  .empty svg { width: 24px; height: 24px; }
  .tall .empty { justify-content: flex-start; padding-top: 48px; }

  @media (max-width: 1200px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .tall { height: auto; max-height: 470px; } }
  @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }


  /* ---------- Players ---------- */
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .head-tools { margin-top: 8px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
  .search input {
    width: 256px; height: 32px; padding: 0 12px 0 34px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--raised); color: var(--text); font: inherit; font-size: 13px;
  }
  .search input::placeholder { color: var(--label); }
  .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
  }
  .pill:hover { color: var(--text); }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot, #6f6f6f); }
  .pill .n { color: var(--label); }
  .pill.active { background: var(--active-bg); border-color: var(--border-hi); color: var(--ink); font-weight: 600; }
  .pill.active .n { color: var(--muted); }

  .table-wrap { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow-x: auto; }
  table.players { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px; }
  .players th {
    text-align: left; font-weight: 500; font-size: 12px; color: var(--muted);
    padding: 11px 16px; border-bottom: 1px solid var(--border);
  }
  .players td { padding: 10px 16px; color: #b1b1b1; vertical-align: middle; }
  .players tr + tr td { border-top: 1px solid var(--border); }
  .players tbody tr:hover td { background: #141414; }
  .pl { display: flex; align-items: center; gap: 10px; }
  .avatar { position: relative; overflow: hidden; width: 30px; height: 30px; border-radius: 8px; background: #1f1f1f; color: var(--label); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #1f1f1f; }
  .pname { color: var(--ink); font-weight: 600; font-size: 13.5px; }
  .team { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); font-weight: 500; }
  .team i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, #6f6f6f); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: color-mix(in srgb, var(--c) 18%, transparent); color: color-mix(in srgb, var(--c) 70%, #fff); }
  .no-results { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }


  /* ---------- Moderations + modal ---------- */
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px;
    border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .btn-primary svg { width: 15px; height: 15px; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:active:not(:disabled) { transform: translateY(1px); }
  .btn-primary:disabled { background: var(--raised); color: var(--label); cursor: not-allowed; }
  .btn-primary:focus-visible, .btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-ghost {
    height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid #2c2c2c; background: var(--raised);
    color: var(--text); font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
  }
  .btn-ghost:hover { background: #1c1c1c; }
  .btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-ghost svg { width: 15px; height: 15px; flex: none; }
  .menu button svg { width: 15px; height: 15px; flex: none; color: var(--muted); }
  .menu button:disabled svg { color: inherit; }
  .q-empty svg { width: 24px; height: 24px; color: var(--muted); margin-bottom: 6px; }

  .filter-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .filter-row .spacer { flex: 1; }
  .filter-row .pill { --dot: var(--c); }
  .only-mine { display: inline-flex; align-items: center; gap: 8px; margin-left: 4px; font-size: 13px; color: var(--muted); cursor: pointer; }

  .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch i { position: absolute; inset: 0; border-radius: 999px; background: #252525; border: 1px solid #333333; transition: background .15s; }
  .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
  .switch input:checked + i { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + i::after { background: var(--accent-ink); }
  .switch input:checked + i::after { transform: translateX(16px); }
  .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty-card { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 38px 24px 42px; text-align: center; }
  .empty-card svg { width: 28px; height: 28px; color: var(--label); }
  .empty-card b { display: block; margin: 10px 0 8px; font-size: 13.5px; color: #b6b6b6; font-weight: 600; }
  .empty-card p { margin: 0 auto; max-width: 380px; font-size: 12.5px; line-height: 1.6; color: var(--label); }

  .case { color: var(--label); font-size: 12px; white-space: nowrap; }
  .reason { display: flex; align-items: baseline; max-width: 380px; }
  .reason span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reason a { flex: none; color: var(--text); text-decoration: underline; text-underline-offset: 2px; margin-left: 8px; font-size: 12px; }
  .reason a:hover { text-decoration: underline; }
  .dur { display: block; margin-top: 3px; font-size: 12px; color: var(--label); }

  .modal-back {
    position: fixed; inset: 0; z-index: 50; background: rgba(2,3,6,.72); backdrop-filter: blur(3px);
    display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; overscroll-behavior: contain;
  }
  .modal { width: 100%; max-width: 572px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { margin: 0 0 6px; font-size: 16.5px; font-weight: 600; color: var(--ink); }
  .modal-head p { margin: 0; font-size: 13px; color: var(--muted); }
  .x { width: 28px; height: 28px; border: 0; background: none; color: var(--muted); border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
  .x:hover { background: var(--hover); color: var(--ink); }
  .x:focus-visible { outline: 2px solid var(--accent); }
  .x svg { width: 16px; height: 16px; }
  .modal-body { padding: 16px 16px 8px; }
  .modal-sm { max-width: 420px; margin-top: 15vh; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; max-width: min(480px, calc(100vw - 32px));
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--raised); color: var(--ink); font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px; border-top: 1px solid var(--border); }

  .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .type-card {
    text-align: left; padding: 11px 12px 12px; min-height: 76px; border-radius: 10px; cursor: pointer;
    border: 1px solid #272727; background: var(--raised); color: var(--label); font: inherit;
  }
  .type-card .tt { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--c); }
  .type-card .tt svg { width: 15px; height: 15px; }
  .type-card .td { display: block; margin-top: 6px; font-size: 12px; line-height: 1.4; color: #707070; }
  .type-card:hover { border-color: #383838; }
  .type-card.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 8%, var(--raised)); }
  .type-card:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }

  .field { display: block; margin: 0 0 18px; }
  .field > span { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: #cccccc; }
  .field em { color: #f43f5e; font-style: normal; }
  .field input, .field textarea {
    display: block; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #272727;
    background: var(--raised); color: var(--text); font: inherit; font-size: 13.5px;
  }
  .field textarea { min-height: 96px; resize: vertical; }
  .field input::placeholder, .field textarea::placeholder { color: var(--label); }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .field small { display: block; margin-top: 8px; font-size: 12px; color: var(--label); }

  .pm { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #272727; border-radius: 10px; background: var(--raised); margin-bottom: 8px; }
  .pm-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--active-bg); color: var(--text); display: grid; place-items: center; flex: none; }
  .pm-icon svg { width: 16px; height: 16px; }
  .pm-text { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .pm-text small { display: block; margin-top: 3px; font-size: 12px; font-weight: 400; color: var(--muted); }
  [hidden] { display: none !important; }

  @media (max-width: 560px) { .types { grid-template-columns: repeat(2, 1fr); } .filter-row .spacer { display: none; } .filter-row .search { flex: 1 1 100%; } .filter-row .search input { width: 100%; } }


  .logbadge {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px;
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    background: color-mix(in srgb, var(--c) 12%, transparent);
    color: var(--c); font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }
  .logbadge svg { width: 13px; height: 13px; }
  .logid { margin-left: 8px; font-family: var(--mono); font-size: 12px; color: var(--label); }
  .logdur { margin-left: 8px; font-size: 12px; color: var(--label); }
  .mod { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 600; font-size: 13px; }
  .mavatar { width: 22px; height: 22px; border-radius: 50%; background: #262626 center/cover; color: var(--muted); display: grid; place-items: center; font-size: 9.5px; font-weight: 700; flex: none; }
  .status { display: inline-block; padding: 3px 10px; border-radius: 6px; border: 1px solid #2c2c2c; background: #1c1c1c; color: #acacac; font-size: 12px; }
  .players th.r, .players td.r { text-align: right; }


  /* ---------- Live map ---------- */
  .content.flush { padding: 0; overflow: hidden; }
  .content.flush .page-head { display: none; }
  .lm { display: flex; height: 100vh; }
  .lm-side { width: 318px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: #0e0e0e; min-height: 0; }
  .lm-head { padding: 18px 14px 14px; border-bottom: 1px solid var(--border); }
  .lm-head h2 { margin: 0 0 4px; font-size: 17px; font-weight: 700; color: var(--ink); }
  .lm-head p { margin: 0 0 14px; font-size: 12px; color: var(--muted); }
  .lm-head .search input { width: 100%; height: 34px; }
  .lm-head .pills { margin: 12px 0 0; gap: 6px; }
  .lm-list { flex: 1; overflow-y: auto; padding: 6px; }
  .lm-row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; cursor: pointer; padding: 8px 10px; border-radius: 8px; color: var(--muted); font: inherit; font-size: 13px; }
  .lm-row:hover, .lm-row.sel { background: var(--hover); color: var(--text); }
  .lm-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .lm-row i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .lm-row b { color: var(--ink); font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lm-row span { font-size: 12px; color: var(--label); flex: none; }

  .lm-map {
    position: relative; flex: 1; min-width: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none;
    background-color: #0d0d0d;
    background-image: linear-gradient(#161616 1px, transparent 1px), linear-gradient(90deg, #161616 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .lm-map.nogrid { background-image: none; }
  .lm-map.grabbing { cursor: grabbing; }
  .lm-map:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .set-skel { grid-column: 2; display: grid; gap: 14px; }

  /* ---------- Roles ---------- */
  .role-row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; }

  /* ---------- Quotas & leave ---------- */

  .lb-bar.q-bar i { background: var(--c, var(--muted)); }

  .q-past { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 18px; font-size: 13.5px; color: var(--muted); }

  /* ---------- Shifts ---------- */
  .shifts-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; grid-template-areas: "mine lb" "now lb"; align-items: stretch; }
  .shifts-grid > .panel:nth-child(1) { grid-area: mine; } .shifts-grid > .panel:nth-child(2) { grid-area: now; } .shifts-grid > .panel:nth-child(3) { grid-area: lb; }
  .shift-box { margin: 16px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--side); }

  .panel-head .seg { padding: 2px; }

  .lb { padding: 8px; }
  .lb-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px; }
  .lb-row.me { background: var(--active-bg); }
  .lb-rank { width: 18px; display: grid; place-items: center; color: var(--label); font-size: 12px; flex: none; }
  .lb-rank svg { width: 16px; height: 16px; color: #f5c518; }

  .lb-bar { height: 5px; border-radius: 3px; background: #1d1d1d; margin: 6px 0 5px; overflow: hidden; }

  .lb-meta { font-size: 12px; color: var(--label); }

  .now-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  .now-row .nm { flex: 1; color: var(--ink); font-weight: 600; font-size: 13.5px; }

  .mono-m { font-family: var(--mono); font-size: 12px; color: var(--label); }
  #shRecent { overflow-x: auto; }
  @media (max-width: 900px) { .shifts-grid { grid-template-columns: 1fr; grid-template-areas: "mine" "now" "lb"; } }

  @media (max-width: 760px) {
    body { flex-direction: column; }

  }

  /* Touch: 44px targets on coarse pointers */
  @media (pointer: coarse) {
    .item, .pill, .seg button, .btn-primary, .btn-ghost, .btn-danger, .btn-sm, .search input { min-height: 44px; }
    .x, .dots-btn, .lm-btn, .side-toggle { min-width: 44px; min-height: 44px; }
    /* iOS zooms into inputs under 16px */

  }
  /* ---------- Motion ----------
     Only motion that explains something: where you went, what opened, what you pressed.
     Entrances only; things close instantly. The reduced-motion block below switches all of it off. */
  :root { --ease-out: cubic-bezier(.16, 1, .3, 1); }
  #view.enter { animation: pageIn .26s var(--ease-out); }
  .page-head.enter { animation: fadeIn .2s ease-out; }
  .modal-back, .drawer-back { animation: fadeIn .16s ease-out; }
  .modal { animation: popIn .22s var(--ease-out); }
  .drawer { animation: slideIn .26s var(--ease-out); }
  .menu { animation: menuIn .14s var(--ease-out); transform-origin: top right; }
  .set-skel i { animation: pulse 1.4s ease-in-out infinite; }
  .btn-ghost:active:not(:disabled), .btn-danger:active:not(:disabled), .btn-sm:active:not(:disabled),
  .pill:active, .seg button:active, .dots-btn:active, .x:active, .item:active { transform: translateY(1px); }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes pageIn { from { opacity: 0; transform: translateY(6px); } }
  @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.985); } }
  @keyframes slideIn { from { opacity: .4; transform: translateX(32px); } }
  @keyframes menuIn { from { opacity: 0; transform: scale(.96); } }
  @keyframes pulse { 50% { opacity: .55; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
