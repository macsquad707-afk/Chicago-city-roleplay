<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verified</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;font-family:'Poppins',system-ui,sans-serif;
  background:radial-gradient(800px 600px at 0% 0%,#1d4166,transparent 70%),#0a1424}
.card{width:100%;max-width:420px;background:#0f2038;border:1px solid #1b2f4d;border-radius:22px;padding:40px 40px 36px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.check{width:80px;height:80px;margin:0 auto 22px;border:2px solid #4a9eed;border-radius:50%;display:grid;place-items:center;color:#4a9eed}
.check svg{width:34px;height:34px}
.k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#4a9eed}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 14px}
.msg{font-size:14px;color:#c4cfe0}
.msg b{color:#7cb7f5;font-weight:500}
.user{margin:28px 0 24px;padding-bottom:24px;border-bottom:1px solid #1b2f4d}
.user h2{font-size:26px;font-weight:800;margin-top:8px;word-break:break-all}
.ids{text-align:left;font-size:12px;color:#8fa3c0;display:grid;gap:6px;margin-bottom:22px}
.ids b{color:#fff;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:10px;background:#22344f;border-radius:12px;padding:12px 22px;font-weight:700;font-size:14px;color:#fff;text-decoration:none}
.btn:hover{background:#2b4263}
.btn svg{width:18px;height:18px;fill:currentColor}
.left{text-align:left}
</style>
</head>
<body>
<main class="card">
  <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
  <div class="k">Verified</div>
  <h1>You're all set.</h1>
  <p class="msg">Your accounts are linked. Head back to Discord &mdash; the <b>Verified</b> role is already on its way.</p>
  <div class="user"><div class="k">Roblox username</div><h2 id="rname"></h2></div>
  <div class="ids"><div>Roblox ID <b id="rid"></b></div><div>Discord ID <b id="did"></b></div></div>
  <div class="left"><a class="btn" id="back" href="#"><svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18 18 0 0 0-6.4 0L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9 0 13.5.3 18a20 20 0 0 0 6 3l.8-1.3a13 13 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l.8 1.3a20 20 0 0 0 6-3c.5-5.2-.9-9.7-3.8-13.6zM8.7 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm6.6 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>Back to our Discord</a></div>
</main>
<script src="verified.js"></script>
</body>
</html>
