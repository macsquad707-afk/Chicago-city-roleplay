<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#41b6e6">
<title>Verified</title>
<link rel="icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--white:#fff;--sky:#41b6e6;--red:#e4002b;--ink:#14212b;--steel:#5b6770;--line:#dde4ea;--mist:#f3f6f8;font-family:'Archivo',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--white);color:var(--ink);line-height:1.55;border-top:16px solid var(--sky);border-bottom:16px solid var(--sky)}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
main{width:100%;max-width:440px}
.star{width:56px;height:56px;fill:var(--red);margin-bottom:24px}
h1{font-stretch:68%;font-weight:850;font-size:clamp(52px,12vw,80px);line-height:.88;text-transform:uppercase}
.msg{color:var(--steel);font-size:17px;margin:16px 0 28px}
dl{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px}
dt{color:var(--steel)}
dd{font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-height:1.55em}
dd.name{font-stretch:85%;font-size:22px;line-height:1.2}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:4px;background:var(--ink);color:var(--white);font-weight:700;text-decoration:none;transition:background-color .15s}
.btn:hover{background:#26394a}
.btn svg{width:20px;height:20px;fill:currentColor}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
  <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50.0,0.0 62.0,29.2 93.3,25.0 74.0,50.0 93.3,75.0 62.0,70.8 50.0,100.0 38.0,70.8 6.7,75.0 26.0,50.0 6.7,25.0 38.0,29.2"/></svg>
  <h1>You're verified</h1>
  <p class="msg">Your Roblox and Discord accounts are linked. Your Verified role is on its way in Discord.</p>
  <dl aria-busy="true" id="ids">
    <dt>Roblox</dt><dd class="name" id="rname" translate="no">Loading…</dd>
    <dt>Roblox ID</dt><dd id="rid" translate="no"></dd>
    <dt>Discord ID</dt><dd id="did" translate="no"></dd>
  </dl>
  <a class="btn" id="back" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18 18 0 0 0-6.4 0L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9 0 13.5.3 18a20 20 0 0 0 6 3l.8-1.3a13 13 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l.8 1.3a20 20 0 0 0 6-3c.5-5.2-.9-9.7-3.8-13.6zM8.7 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm6.6 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>Back to Discord</a>
</main>
<script src="/verified.js"></script>
</body>
</html>
